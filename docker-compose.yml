services:
  db:
    image: postgres:16-alpine
    container_name: rupeedial-crm-db
    environment:
      POSTGRES_USER: rupeedial
      POSTGRES_PASSWORD: rupeedial
      POSTGRES_DB: rupeedial_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupeedial -d rupeedial_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rupeedial-crm-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rupeedial:rupeedial@db:5432/rupeedial_crm
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
